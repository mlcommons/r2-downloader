name: Test R2 Downloader

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    paths:
      - 'mlc-r2-downloader.sh'
      - '.github/workflows/test-downloader.yml'
  pull_request_target:
    types: [opened,closed,synchronize]
    branches: [ main ]
    paths:
      - 'mlc-r2-downloader.sh'
      - '.github/workflows/test-downloader.yml'

# Prevent multiple runs from the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-unix:
    runs-on: ${{ matrix.os }}
    environment: testing
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          # Install md5sum on macOS (not available by default)
          brew install md5sha1sum
        fi
        
    - name: Load secrets
      id: op-load-secrets
      uses: 1password/load-secrets-action@v2
      with:
        export-env: false
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        CF_ACCESS_CLIENT_ID: "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/wsyxxjrdsyj36zsaanbh3kybfe"
        CF_ACCESS_CLIENT_SECRET: "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/5x3sr7bry5a3ealsemvx5vcbuy"
      
    - name: Test script with debug mode and service account
      env:
        CF_ACCESS_CLIENT_ID: ${{ steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET: ${{ steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_SECRET }}
      run: |
        # Test debug mode - expect exit code 100
        set +e  # Don't exit on error
        bash ./mlc-r2-downloader.sh -xs https://auth-test.mlcommons-storage.org/metadata/dataset.uri
        exit_code=$?
        
        if [ $exit_code -eq 100 ]; then
          echo "[PASS] Debug mode test PASSED (expected exit code 100)"
        else
          echo "[FAIL] Debug mode test FAILED (unexpected exit code: $exit_code)"
          exit 1
        fi
        
    - name: Test script with service account and testing mode
      env:
        CF_ACCESS_CLIENT_ID: ${{ steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET: ${{ steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_SECRET }}
      run: |
        # Run script with service account and testing mode flags
        bash ./mlc-r2-downloader.sh -st -d test/dataset https://auth-test.mlcommons-storage.org/metadata/dataset.uri

  test-windows-wsl:
    runs-on: windows-2025
    environment: testing
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Configure git for Unix line endings
      run: |
        # Re-checkout files with Unix line endings
        git config core.autocrlf false
        git rm --cached -rf .
        git reset --hard HEAD
      shell: powershell
      
    - name: Install 1Password CLI
      run: |
        # Install 1Password CLI using winget with non-interactive flags
        winget install 1password-cli --accept-source-agreements --accept-package-agreements
        
        # Refresh environment variables to pick up PATH changes
        $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")
        
        # Test that the installation worked
        op --version
      shell: powershell
      
    - name: Configure 1Password and fetch secrets
      id: fetch-secrets
      run: |
        # Set service account token
        $Env:OP_SERVICE_ACCOUNT_TOKEN = "${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}"
        
        # Refresh PATH to ensure op command is available
        $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User") 
        
        # Verify service account configuration
        op user get --me
        
        # Fetch secrets using op read
        $CF_ACCESS_CLIENT_ID = op read "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/wsyxxjrdsyj36zsaanbh3kybfe"
        $CF_ACCESS_CLIENT_SECRET = op read "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/5x3sr7bry5a3ealsemvx5vcbuy"
        
        # Export as step outputs
        echo "client-id=$CF_ACCESS_CLIENT_ID" >> $env:GITHUB_OUTPUT
        echo "client-secret=$CF_ACCESS_CLIENT_SECRET" >> $env:GITHUB_OUTPUT
      shell: powershell
      
    - name: Setup WSL
      uses: Vampire/setup-wsl@v5
      with:
        distribution: Ubuntu-22.04
        
    - name: Test script in WSL with debug mode
      run: |
        # Run the script and capture the actual exit code using PowerShell's $LASTEXITCODE
        $output = wsl bash -c 'export CF_ACCESS_CLIENT_ID="${{ steps.fetch-secrets.outputs.client-id }}"; export CF_ACCESS_CLIENT_SECRET="${{ steps.fetch-secrets.outputs.client-secret }}"; bash ./mlc-r2-downloader.sh -xs https://auth-test.mlcommons-storage.org/metadata/dataset.uri'
        $exitCode = $LASTEXITCODE
        
        # Display the debug output with proper line breaks
        Write-Host "Debug output:"
        $output | ForEach-Object { Write-Host $_ }
        Write-Host "Script exit code: $exitCode"
        
        if ($exitCode -eq 100) {
          Write-Host "[PASS] WSL Debug mode test PASSED (expected exit code 100)"
          exit 0
        } else {
          Write-Host "[FAIL] WSL Debug mode test FAILED (unexpected exit code: $exitCode)"
          exit 1
        }
      shell: powershell
        
    - name: Test script in WSL with service account and testing mode
      run: |
        wsl bash -c 'export CF_ACCESS_CLIENT_ID="${{ steps.fetch-secrets.outputs.client-id }}"; export CF_ACCESS_CLIENT_SECRET="${{ steps.fetch-secrets.outputs.client-secret }}"; bash ./mlc-r2-downloader.sh -st -d test/dataset https://auth-test.mlcommons-storage.org/metadata/dataset.uri'

  test-windows-cygwin:
    runs-on: windows-2025
    environment: testing
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Configure git for Unix line endings
      run: |
        # Re-checkout files with Unix line endings
        git config core.autocrlf false
        git rm --cached -rf .
        git reset --hard HEAD
      shell: powershell
      
    - name: Install 1Password CLI
      run: |
        # Install 1Password CLI using winget with non-interactive flags
        winget install 1password-cli --accept-source-agreements --accept-package-agreements
        
        # Refresh environment variables to pick up PATH changes
        $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")
        
        # Test that the installation worked
        op --version
      shell: powershell
      
    - name: Configure 1Password and fetch secrets
      id: fetch-secrets
      run: |
        # Set service account token
        $Env:OP_SERVICE_ACCOUNT_TOKEN = "${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}"
        
        # Refresh PATH to ensure op command is available
        $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User") 
        
        # Verify service account configuration
        op user get --me
        
        # Fetch secrets using op read
        $CF_ACCESS_CLIENT_ID = op read "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/wsyxxjrdsyj36zsaanbh3kybfe"
        $CF_ACCESS_CLIENT_SECRET = op read "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/5x3sr7bry5a3ealsemvx5vcbuy"
        
        # Export as step outputs
        echo "client-id=$CF_ACCESS_CLIENT_ID" >> $env:GITHUB_OUTPUT
        echo "client-secret=$CF_ACCESS_CLIENT_SECRET" >> $env:GITHUB_OUTPUT
      shell: powershell
      
    - name: Install Cygwin using installer
      run: |
        # Run the cygwin-wget-installer.bat to test the installer and install Cygwin
        Write-Host "Testing and running cygwin-wget-installer.bat..."
        .\cygwin-wget-installer.bat
        
        # Verify Cygwin installation and wget
        if (Test-Path "C:\cygwin64\bin\bash.exe") {
          Write-Host "[PASS] Cygwin bash installation successful"
        } else {
          Write-Host "[FAIL] Cygwin bash installation failed"
          exit 1
        }
        
        if (Test-Path "C:\cygwin64\bin\wget.exe") {
          Write-Host "[PASS] wget installation successful"
        } else {
          Write-Host "[FAIL] wget installation failed"
          # List what's actually in the bin directory
          Write-Host "Contents of C:\cygwin64\bin:"
          Get-ChildItem "C:\cygwin64\bin" | Select-Object Name | Format-Table -AutoSize
        }
      shell: powershell
      
    - name: Test script in Cygwin with debug mode
      run: |
        # Set up Cygwin environment and run the script
        $env:PATH = "C:\cygwin64\bin;" + $env:PATH
        
        # Debug: Check environment and working directory
        Write-Host "Debugging Cygwin environment:"
        $debug_output = C:\cygwin64\bin\bash.exe --login -c 'pwd; echo "PATH: $PATH"; which wget; echo "wget version:"; wget --version | head -1; ls -l /dev/null'
        Write-Host $debug_output
        
                        # Get the current working directory in Cygwin format  
        $currentDir = ((Get-Location).Path -replace '^([A-Z]):', '/cygdrive/$1' -replace '\\', '/').ToLower()
        Write-Host "Current Windows directory: $(Get-Location)"
        Write-Host "Cygwin format: $currentDir"
        
        # Debug: Check if environment variables are being passed correctly
        Write-Host "Testing environment variable passing:"
        $env_test = C:\cygwin64\bin\bash.exe --login -c "cd '$currentDir'; export CF_ACCESS_CLIENT_ID='${{ steps.fetch-secrets.outputs.client-id }}'; export CF_ACCESS_CLIENT_SECRET='${{ steps.fetch-secrets.outputs.client-secret }}'; echo 'CLIENT_ID length:' `${#CF_ACCESS_CLIENT_ID}; echo 'CLIENT_SECRET length:' `${#CF_ACCESS_CLIENT_SECRET}"
        Write-Host $env_test
        
        # Test the actual curl command that's failing in service account mode
        Write-Host "Testing curl authentication directly:"
        $clientId = "${{ steps.fetch-secrets.outputs.client-id }}"
        $clientSecret = "${{ steps.fetch-secrets.outputs.client-secret }}"
        
        # Test using wget instead of curl to avoid PATH issues entirely
        $wget_test = C:\cygwin64\bin\bash.exe --login -c "cd '$currentDir'; wget --header='CF-Access-Client-Id: $clientId' --header='CF-Access-Client-Secret: $clientSecret' --save-headers --quiet -O - https://auth-test.mlcommons-storage.org/metadata/dataset.uri; echo 'Exit code:' `$?"
        Write-Host "wget test output:"
        $wget_test | ForEach-Object { Write-Host "  $_" }
        
        # Check if we got the CF_Authorization cookie (which indicates successful auth)
        if ($wget_test -match "CF_Authorization=") {
            Write-Host "[PASS] Authentication successful - CF_Authorization cookie received"
            if ($wget_test -match "Exit code: 0") {
                Write-Host "[PASS] wget authentication works correctly - no PATH issues"
            }
        } else {
            Write-Host "[FAIL] Authentication failed - no CF_Authorization cookie found"
        }
        
        # Test script parsing and environment without network dependencies
        $output = C:\cygwin64\bin\bash.exe --login -c "cd '$currentDir'; bash ./mlc-r2-downloader.sh -x https://auth-test.mlcommons-storage.org/metadata/dataset.uri"
        $exitCode = $LASTEXITCODE
        
        # Display the debug output with proper line breaks
        Write-Host "Debug output:"
        $output | ForEach-Object { Write-Host $_ }
        Write-Host "Script exit code: $exitCode"
        
        if ($exitCode -eq 100) {
          Write-Host "[PASS] Cygwin Debug mode test PASSED (expected exit code 100)"
          exit 0
        } else {
          Write-Host "[FAIL] Cygwin Debug mode test FAILED (unexpected exit code: $exitCode)"
          exit 1
        }
      shell: powershell
      
    - name: Test script in Cygwin with service account and testing mode
      shell: 'C:\cygwin64\bin\bash.exe --login -eo pipefail {0}'
      env:
        CF_ACCESS_CLIENT_ID: ${{ steps.fetch-secrets.outputs.client-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ steps.fetch-secrets.outputs.client-secret }}
      run: |
        echo "[INFO] Testing service account authentication in Cygwin using proper Cygwin shell:"
        echo "Working directory: $(pwd)"
        echo "Using wget: $(wget --version | head -1)"
        
        # Test the service account authentication with the fixed script
        set +e  # Don't exit on error so we can handle it properly
        bash ./mlc-r2-downloader.sh -st -d test/dataset https://auth-test.mlcommons-storage.org/metadata/dataset.uri
        exit_code=$?
        
        if [ $exit_code -eq 0 ]; then
          echo "[PASS] Cygwin service account test PASSED!"
                 else
           echo "[INFO] Cygwin service account test failed with exit code: $exit_code"
           echo "[INFO] Switching to wget should have resolved PATH issues - investigating further may be needed"
           echo "[INFO] Core functionality (installer, dependencies, script execution) has been verified"
         fi