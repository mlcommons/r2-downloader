name: Test R2 Downloader & Cygwin + Wget Installer

on:
  workflow_dispatch:
  pull_request:
    types: [opened,closed,synchronize]
    branches: [ main ]
    paths:
      - 'mlc-r2-downloader.sh'
      - 'cygwin-wget-installer.bat'
      - '.github/workflows/test-downloader.yml'

# Prevent multiple runs from the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Define all test cases in a centralized matrix
  define-tests:
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          echo 'matrix={
            "include": [
              {
                "name": "help_flag",
                "description": "Help flag should work without URL",
                "args": "-h",
                "url": "",
                "expect_exit": 0,
                "needs_auth": false,
                "skip_url": true
              },
              {
                "name": "debug_mode",
                "description": "Debug mode with service account",
                "args": "-xs",
                "url": "https://auth-test.mlcommons-storage.org/metadata/dataset.uri",
                "expect_exit": 0,
                "needs_auth": true,
                "skip_url": false
              },
              {
                "name": "missing_url_service_account",
                "description": "Service account flag without URL should fail",
                "args": "-s",
                "url": "",
                "expect_exit": 1,
                "needs_auth": false,
                "skip_url": true
              },
              {
                "name": "missing_url_multiple_flags",
                "description": "Multiple flags without URL should fail",
                "args": "-s -t",
                "url": "",
                "expect_exit": 1,
                "needs_auth": false,
                "skip_url": true
              },
              {
                "name": "missing_download_dir_arg",
                "description": "Download directory flag without directory argument should fail",
                "args": "-d",
                "url": "https://no-auth-test.mlcommons-storage.org/metadata/dataset.uri",
                "expect_exit": 1,
                "needs_auth": false,
                "skip_url": false
              },
              {
                "name": "service_account_auth",
                "description": "Service account with testing mode (auth required)",
                "args": "-st -d test/dataset",
                "url": "https://auth-test.mlcommons-storage.org/metadata/dataset.uri",
                "expect_exit": 0,
                "needs_auth": true,
                "skip_url": false
              },
              {
                "name": "no_auth_required",
                "description": "No authentication required dataset",
                "args": "-st -d test/dataset",
                "url": "https://no-auth-test.mlcommons-storage.org/metadata/dataset.uri",
                "expect_exit": 0,
                "needs_auth": false,
                "skip_url": false
              },
              {
                "name": "single_file_dataset",
                "description": "Single file dataset download",
                "args": "",
                "url": "https://no-auth-test.mlcommons-storage.org/metadata/single-file-dataset.uri",
                "expect_exit": 0,
                "needs_auth": false,
                "skip_url": false
              },
              {
                "name": "invalid_url",
                "description": "Invalid URL format should fail",
                "args": "-st",
                "url": "not-a-valid-url",
                "expect_exit": 1,
                "needs_auth": false,
                "skip_url": false
              },
              {
                "name": "missing_credentials",
                "description": "Service account without credentials should fail",
                "args": "-s",
                "url": "https://auth-test.mlcommons-storage.org/metadata/dataset.uri",
                "expect_exit": 1,
                "needs_auth": false,
                "skip_url": false,
                "skip_creds": true
              }
            ]
          }' >> $GITHUB_OUTPUT

  # Unix platforms (Linux and macOS)
  test-unix:
    needs: define-tests
    runs-on: ${{ matrix.os }}
    environment: testing
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        test: ${{ fromJson(needs.define-tests.outputs.test-matrix).include }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          # Install md5sum on macOS (not available by default)
          brew install md5sha1sum
        fi
        
    - name: Load secrets
      if: matrix.test.needs_auth
      id: op-load-secrets
      uses: 1password/load-secrets-action@v3
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        CF_ACCESS_CLIENT_ID: "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/wsyxxjrdsyj36zsaanbh3kybfe"
        CF_ACCESS_CLIENT_SECRET: "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/5x3sr7bry5a3ealsemvx5vcbuy"
      
    - name: Test - ${{ matrix.test.name }} (${{ matrix.test.description }})
      env:
        CF_ACCESS_CLIENT_ID: ${{ matrix.test.needs_auth && steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_ID || '' }}
        CF_ACCESS_CLIENT_SECRET: ${{ matrix.test.needs_auth && steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_SECRET || '' }}
      run: |
        set +e  # Don't exit on error so we can check exit codes
        
        # Skip credentials for specific tests
        if [[ "${{ matrix.test.skip_creds }}" == "true" ]]; then
          unset CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
        fi
        
        # Build command
        if [[ "${{ matrix.test.skip_url }}" == "true" ]]; then
          cmd="bash ./mlc-r2-downloader.sh ${{ matrix.test.args }}"
        else
          cmd="bash ./mlc-r2-downloader.sh ${{ matrix.test.args }} ${{ matrix.test.url }}"
        fi
        
        echo "Running: $cmd"
        eval "$cmd"
        exit_code=$?
        
        # Check exit code
        expected_exit=${{ matrix.test.expect_exit }}
        if [ $exit_code -eq $expected_exit ]; then
          echo "✅ [PASS] ${{ matrix.test.name }} - Expected exit code $expected_exit, got $exit_code"
        else
          echo "❌ [FAIL] ${{ matrix.test.name }} - Expected exit code $expected_exit, got $exit_code"
          exit 1
        fi

  # Windows WSL
  test-windows-wsl:
    needs: define-tests
    runs-on: windows-latest
    environment: testing
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.define-tests.outputs.test-matrix).include }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Configure git for Unix line endings
      shell: powershell
      run: |
        # Re-checkout files with Unix line endings
        git config core.autocrlf false
        git rm --cached -rf .
        git reset --hard HEAD
        
    - name: Load secrets
      if: matrix.test.needs_auth
      id: op-load-secrets
      uses: 1password/load-secrets-action@v3
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        CF_ACCESS_CLIENT_ID: "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/wsyxxjrdsyj36zsaanbh3kybfe"
        CF_ACCESS_CLIENT_SECRET: "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/5x3sr7bry5a3ealsemvx5vcbuy"
      
    - name: Setup WSL
      uses: Vampire/setup-wsl@v5
      with:
        distribution: Ubuntu-22.04
        
    - name: Test WSL - ${{ matrix.test.name }} (${{ matrix.test.description }})
      env:
        CF_ACCESS_CLIENT_ID: ${{ matrix.test.needs_auth && steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_ID || '' }}
        CF_ACCESS_CLIENT_SECRET: ${{ matrix.test.needs_auth && steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_SECRET || '' }}
      shell: powershell
      run: |
        # Capture environment variables
        $clientId = $env:CF_ACCESS_CLIENT_ID
        $clientSecret = $env:CF_ACCESS_CLIENT_SECRET
        
        # Skip credentials for specific tests
        if ("${{ matrix.test.skip_creds }}" -eq "true") {
          $clientId = ""
          $clientSecret = ""
        }
        
        # Build command
        $envVars = ""
        if ($clientId -and $clientSecret) {
          $envVars = "export CF_ACCESS_CLIENT_ID='$clientId'; export CF_ACCESS_CLIENT_SECRET='$clientSecret';"
        }
        
        if ("${{ matrix.test.skip_url }}" -eq "true") {
          $cmd = "$envVars bash ./mlc-r2-downloader.sh ${{ matrix.test.args }}"
        } else {
          $cmd = "$envVars bash ./mlc-r2-downloader.sh ${{ matrix.test.args }} ${{ matrix.test.url }}"
        }
        
        Write-Host "Running WSL command: $cmd"
        
        # Execute and capture output/exit code
        $output = wsl bash -c $cmd
        $exitCode = $LASTEXITCODE
        
        # Display output
        Write-Host "Output:"
        $output | ForEach-Object { Write-Host $_ }
        
        # Check exit code
        $expectedExit = ${{ matrix.test.expect_exit }}
        if ($exitCode -eq $expectedExit) {
          Write-Host "✅ [PASS] ${{ matrix.test.name }} - Expected exit code $expectedExit, got $exitCode"
        } else {
          Write-Host "❌ [FAIL] ${{ matrix.test.name }} - Expected exit code $expectedExit, got $exitCode"
          exit 1
        }

  # Windows Cygwin
  test-windows-cygwin:
    needs: define-tests
    runs-on: windows-latest
    environment: testing
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.define-tests.outputs.test-matrix).include }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Configure git for Unix line endings
      shell: powershell
      run: |
        # Re-checkout files with Unix line endings
        git config core.autocrlf false
        git rm --cached -rf .
        git reset --hard HEAD
      
    - name: Load secrets
      if: matrix.test.needs_auth
      id: op-load-secrets
      uses: 1password/load-secrets-action@v3
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        CF_ACCESS_CLIENT_ID: "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/wsyxxjrdsyj36zsaanbh3kybfe"
        CF_ACCESS_CLIENT_SECRET: "op://x4h33jlflygxmifnxfrizew4oa/7g2fhcv3tpsogr2vhkielewvsm/5x3sr7bry5a3ealsemvx5vcbuy"
      
    - name: Install Cygwin+Wget using installer
      shell: powershell
      run: |
        # Run the cygwin-wget-installer.bat to test the installer and install Cygwin
        Write-Host "Testing and running cygwin-wget-installer.bat..."
        .\cygwin-wget-installer.bat
        
        # Verify Cygwin installation and wget
        if (Test-Path "C:\cygwin64\bin\bash.exe") {
          Write-Host "[PASS] Cygwin bash installation successful"
        } else {
          Write-Host "[FAIL] Cygwin bash installation failed"
          exit 1
        }
        
        if (Test-Path "C:\cygwin64\bin\wget.exe") {
          Write-Host "[PASS] wget installation successful"
        } else {
          Write-Host "[FAIL] wget installation failed"
          # List what's actually in the bin directory
          Write-Host "Contents of C:\cygwin64\bin:"
          Get-ChildItem "C:\cygwin64\bin" | Select-Object Name | Format-Table -AutoSize
        }
      
    - name: Test Cygwin - ${{ matrix.test.name }} (${{ matrix.test.description }})
      env:
        CF_ACCESS_CLIENT_ID: ${{ matrix.test.needs_auth && steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_ID || '' }}
        CF_ACCESS_CLIENT_SECRET: ${{ matrix.test.needs_auth && steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_SECRET || '' }}
      shell: powershell
      run: |
        # Capture environment variables
        $clientId = $env:CF_ACCESS_CLIENT_ID
        $clientSecret = $env:CF_ACCESS_CLIENT_SECRET
        
        # Skip credentials for specific tests
        if ("${{ matrix.test.skip_creds }}" -eq "true") {
          $clientId = ""
          $clientSecret = ""
        }
        
        # Convert Windows path to Cygwin path
        $repoPath = (Get-Location).Path -replace '\\', '/' -replace '^([A-Z]):', '/cygdrive/$1'
        $repoPath = $repoPath.ToLower()
        
        # Build command
        $envVars = ""
        if ($clientId -and $clientSecret) {
          $envVars = "export CF_ACCESS_CLIENT_ID='$clientId'; export CF_ACCESS_CLIENT_SECRET='$clientSecret';"
        }
        
        if ("${{ matrix.test.skip_url }}" -eq "true") {
          $cmd = "$envVars bash '$repoPath/mlc-r2-downloader.sh' ${{ matrix.test.args }}; echo `"EXIT_CODE:`$?`""
        } else {
          $cmd = "$envVars bash '$repoPath/mlc-r2-downloader.sh' ${{ matrix.test.args }} ${{ matrix.test.url }}; echo `"EXIT_CODE:`$?`""
        }
        
        Write-Host "Running Cygwin command: $cmd"
        
        # Execute command
        $output = C:\cygwin64\bin\bash.exe --login -c $cmd
        
        # Extract exit code from output
        $exitCode = 0
        $cleanOutput = @()
        foreach ($line in $output) {
          if ($line -match "^EXIT_CODE:(\d+)$") {
            $exitCode = [int]$matches[1]
          } else {
            $cleanOutput += $line
          }
        }
        
        # Display clean output
        Write-Host "Output:"
        $cleanOutput | ForEach-Object { Write-Host $_ }
        
        # Check exit code
        $expectedExit = ${{ matrix.test.expect_exit }}
        if ($exitCode -eq $expectedExit) {
          Write-Host "✅ [PASS] ${{ matrix.test.name }} - Expected exit code $expectedExit, got $exitCode"
        } else {
          Write-Host "❌ [FAIL] ${{ matrix.test.name }} - Expected exit code $expectedExit, got $exitCode"
          exit 1
        }

  # Summary job that depends on all test jobs
  test-summary:
    needs: [test-unix, test-windows-wsl, test-windows-cygwin]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Test Results Summary:"
          echo "Unix tests: ${{ needs.test-unix.result }}"
          echo "WSL tests: ${{ needs.test-windows-wsl.result }}"
          echo "Cygwin tests: ${{ needs.test-windows-cygwin.result }}"
          
          if [[ "${{ needs.test-unix.result }}" != "success" ]] || \
             [[ "${{ needs.test-windows-wsl.result }}" != "success" ]] || \
             [[ "${{ needs.test-windows-cygwin.result }}" != "success" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          else
            echo "✅ All tests passed!"
          fi
